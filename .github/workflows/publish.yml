
name: Build and Publish CapCams

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capcams-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Publish to private Maven repository
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
        run: ./gradlew publish --no-daemon

      - name: Collect release JARs
        shell: bash
        run: |
          mkdir -p release-files
          find . -type f -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*-dev.jar' \
            -exec cp {} release-files/ \;

          if ! find release-files -maxdepth 1 -name '*.jar' \
            -print -quit | grep -q .; then
            echo "ERROR: No JAR files were generated."
            exit 1
          fi

          ls -lh release-files/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="build-${GITHUB_RUN_NUMBER}"

          gh release create "$VERSION" release-files/*.jar \
            --title "CapCams ${VERSION}" \
            --notes "Automated build from commit ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
