plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }
    maven { // Veil
        name = 'BlameJared Maven (CrT / Bookshelf)'
        url = 'https://maven.blamejared.com'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    def veil = "foundry.veil:veil-fabric-${project.minecraft_version}:${project.veil_version}"
    def imguimc = "foundry.imguimc:imguimc-fabric-${project.minecraft_version}:${project.imguimc_version}"
    modCompileOnly(veil) {
        exclude group: "maven.modrinth"
        exclude group: "me.fallenbreath"
    }
    modLocalRuntime(veil) {
        exclude group: "maven.modrinth"
        exclude group: "me.fallenbreath"
    }
    modCompileOnly(imguimc)
    modLocalRuntime(imguimc)
    modCompileOnly files("libs/narrativecraft-api-fabric-1.21.1-2.3.1.jar")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            groupId = project.maven_group
            artifactId = "capcams-fabric-${project.minecraft_version}"
            version = project.mod_version
            from components.java
            pom {
                name = "CapCams"
                description = "Divisiones de camara (pantalla dividida) con Veil, herramienta y addon de NarrativeCraft"
            }
        }
    }
    repositories {
        maven {
            name = "Elbgg"
            def snapshot = project.mod_version.endsWith("-SNAPSHOT")
            url = uri(snapshot ? project.maven_url_snapshots : project.maven_url_releases)
            credentials {
                username = findProperty("reposiliteUser") ?: System.getenv("REPOSILITE_USER")
                password = findProperty("reposilitePassword") ?: System.getenv("REPOSILITE_TOKEN")
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

tasks.register("checkPublishCredentials") {
    doLast {
        def user = findProperty("reposiliteUser") ?: System.getenv("REPOSILITE_USER")
        def token = findProperty("reposilitePassword") ?: System.getenv("REPOSILITE_TOKEN")
        if (!user || !token) {
            throw new GradleException("Faltan las credenciales de Reposilite: define reposiliteUser y reposilitePassword en ~/.gradle/gradle.properties (o REPOSILITE_USER y REPOSILITE_TOKEN en el entorno).")
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn "checkPublishCredentials"
}
